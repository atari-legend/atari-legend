services:
    laravel.test:
        build:
            # composer.json requires PHP ^8.4, and CI and both servers run
            # 8.4.
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # `artisan serve` wraps PHP's built-in server, which handles one
            # request at a time by default - so every page would queue behind
            # its own stylesheets and images. Comfortably above the number of
            # subresources a page fans out into.
            #
            # ServeCommand's log parser races under concurrency (see
            # playwright.config.js). To bypass it, serve the built-in server
            # directly with
            #   SUPERVISOR_PHP_COMMAND: php -S 0.0.0.0:80 -t public tests/e2e/support/server.php
            PHP_CLI_SERVER_WORKERS: 16
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mariadb
            - mailpit
    mariadb:
        # 10.11 LTS. CI pins the same image so that it cannot disagree with
        # this environment on server behaviour, and both servers run 10.11.
        image: 'mariadb:10.11'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            - './vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # Browsing the database from a browser. `sail mariadb` is the other way
    # in, and does not need this service running.
    phpmyadmin:
        image: 'phpmyadmin/phpmyadmin'
        ports:
            - '${FORWARD_PHPMYADMIN_PORT:-8081}:80'
        environment:
            PMA_HOST: mariadb
            UPLOAD_LIMIT: 8M
        networks:
            - sail
        depends_on:
            - mariadb
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
