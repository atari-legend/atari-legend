name: Build
on: [push]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      # Pinned to the same image the docker-compose development environment
      # uses, so CI cannot disagree with it on server behaviour.
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_DATABASE: atarilegend_e2e
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: pcov.directory=app

      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist

      - name: PHP Lint
        run: ./vendor/bin/phplint ./ --exclude=vendor

      # --min is a ratchet against regressions, not a target: raise it as
      # coverage grows. The baseline when it was introduced was 16.3%.
      - name: Run tests
        run: php artisan test --coverage --min=25 --coverage-clover=build/logs/clover.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Cache node_modules/
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          # Playwright refuses to start on anything below 20
          node-version: 22

      - name: Install NPM dependencies
        # ci installs exactly what package-lock.json pins and fails if the
        # lockfile has drifted from package.json. install would silently
        # re-resolve and rewrite the lockfile, so what CI built was never
        # guaranteed to be what the lockfile describes.
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The development environment runs MySQL with an explicit sql-mode (see
      # mysqld.cnf), which notably leaves out ONLY_FULL_GROUP_BY. Stock 5.7
      # enables it, so without this CI would reject queries that are fine in
      # development and in production.
      - name: Match the development MySQL configuration
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -proot -e \
            "SET GLOBAL sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION';"

      - name: Run E2E Database Migrations & Seeder
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: atarilegend_e2e
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: testing
          APP_KEY: base64:AckfSECXIvnK5r28GVIWUAxmbBSjTsmF/0rZh1cyWXk=
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class=E2ESeeder --force

      - name: Run Playwright E2E Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: atarilegend_e2e
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: testing
          APP_KEY: base64:AckfSECXIvnK5r28GVIWUAxmbBSjTsmF/0rZh1cyWXk=
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Production optimizations
        if: github.ref == 'refs/heads/master'
        # Clear all caches, they will be rebuilt on the host
        run: |
          php artisan cache:clear
          php artisan config:clear
          php artisan optimize:clear
          php artisan route:clear
          php artisan view:clear
          composer dump-autoload
          composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist --optimize-autoloader

      - name: Deploy development
        if: github.ref == 'refs/heads/development'
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          ./.github/workflows/deploy.sh "${{ secrets.PROD_DEPLOY_USER }}" "${{ secrets.PROD_DEPLOY_HOST }}" "dev.atarilegend.com" "legacydev.atarilegend.com"

      # Example of deploying a custom feature branch on a test site,
      # without a legacy CPANEL
      #
      # - name: Deploy prototype
      #   if: github.ref == 'refs/heads/prototype'
      #   run: |
      #     eval "$(ssh-agent -s)"
      #     ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"
      #     ./.github/workflows/deploy.sh "${{ secrets.PROD_DEPLOY_USER }}" "${{ secrets.PROD_DEPLOY_HOST }}" "prototype.atarilegend.com"

      - name: Deploy production
        if: github.ref == 'refs/heads/master'
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          ./.github/workflows/deploy.sh "${{ secrets.PROD_DEPLOY_USER }}" "${{ secrets.PROD_DEPLOY_HOST }}" "www.atarilegend.com" "legacy.atarilegend.com"
